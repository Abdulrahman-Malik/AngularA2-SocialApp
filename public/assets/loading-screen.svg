<svg xmlns="http://www.w3.org/2000/svg" class="sp-svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Route Posts is loading" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Route Posts — loading</title>

  <style>
    .sp-svg .sp-t1, .sp-svg .sp-t2, .sp-svg .sp-t3 { fill: var(--sp-star, #d2dcff); animation: sp-tw 3.2s ease-in-out infinite; }
    .sp-svg .sp-t2 { animation-duration: 4.6s; animation-delay: -1.4s; }
    .sp-svg .sp-t3 { animation-duration: 6.2s; animation-delay: -3s; }
    @keyframes sp-tw { 0%, 100% { opacity: .2; } 50% { opacity: .95; } }

    .sp-svg .sp-rot { transform-box: view-box; transform-origin: 800px 370px; }
    .sp-svg .sp-spin { animation: sp-rotate 2.6s cubic-bezier(.5, .1, .5, .9) infinite; }
    .sp-svg .sp-orbit { animation: sp-rotate 24s linear infinite reverse; }
    .sp-svg .sp-sat { animation: sp-rotate 9s linear infinite; }
    @keyframes sp-rotate { to { transform: rotate(360deg); } }

    .sp-svg .sp-halo { animation: sp-pulse 3.4s ease-in-out infinite; }
    @keyframes sp-pulse { 0%, 100% { transform: scale(.92); opacity: .7; } 50% { transform: scale(1.08); opacity: 1; } }

    .sp-svg .sp-bar { animation: sp-slide 1.6s cubic-bezier(.65, 0, .35, 1) infinite; }
    @keyframes sp-slide { from { transform: translateX(-100px); } to { transform: translateX(230px); } }

    .sp-svg .sp-in { animation: sp-in .9s cubic-bezier(.22, 1, .36, 1) both; }
    .sp-svg .sp-in-2 { animation-delay: .15s; }
    .sp-svg .sp-in-3 { animation-delay: .3s; }
    @keyframes sp-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .sp-svg * { animation: none !important; }
    }
  </style>

  <defs>
    <linearGradient id="sp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color: var(--sp-bg2, #0b1030)" />
      <stop offset="1" style="stop-color: var(--sp-bg, #060914)" />
    </linearGradient>

    <radialGradient id="sp-glow-a" gradientUnits="userSpaceOnUse" cx="1360" cy="0" r="760">
      <stop offset="0" style="stop-color: var(--sp-accent2, #c18bff); stop-opacity: .26" />
      <stop offset="1" style="stop-color: var(--sp-accent2, #c18bff); stop-opacity: 0" />
    </radialGradient>

    <radialGradient id="sp-glow-b" gradientUnits="userSpaceOnUse" cx="240" cy="0" r="700">
      <stop offset="0" style="stop-color: var(--sp-accent, #8794ff); stop-opacity: .24" />
      <stop offset="1" style="stop-color: var(--sp-accent, #8794ff); stop-opacity: 0" />
    </radialGradient>

    <radialGradient id="sp-halo" gradientUnits="userSpaceOnUse" cx="800" cy="370" r="200">
      <stop offset="0" style="stop-color: var(--sp-accent, #8794ff); stop-opacity: .5" />
      <stop offset="1" style="stop-color: var(--sp-accent, #8794ff); stop-opacity: 0" />
    </radialGradient>

    <linearGradient id="sp-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: var(--sp-accent, #8794ff)" />
      <stop offset="1" style="stop-color: var(--sp-accent2, #c18bff)" />
    </linearGradient>

    <radialGradient id="sp-shine" cx=".3" cy=".22" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".55" />
      <stop offset=".6" stop-color="#fff" stop-opacity="0" />
    </radialGradient>

    <filter id="sp-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" />
    </filter>

    <clipPath id="sp-clip">
      <rect x="690" y="642" width="220" height="4" rx="2" />
    </clipPath>
  </defs>

  <!-- SKY -->
  <rect width="1600" height="900" fill="url(#sp-sky)" />
  <rect width="1600" height="900" fill="url(#sp-glow-a)" />
  <rect width="1600" height="900" fill="url(#sp-glow-b)" />

  <!-- CONSTELLATIONS -->
  <g fill="none" stroke-width="1" style="stroke: var(--sp-star, #d2dcff)" opacity=".22">
    <polyline points="180,150 300,230 420,170 520,290" />
    <polyline points="1120,640 1230,590 1340,690 1440,610 1500,730" />
    <polyline points="1150,140 1260,200 1380,130" />
  </g>
  <g>
    <circle class="sp-t2" cx="180" cy="150" r="3.2" />
    <circle class="sp-t3" cx="300" cy="230" r="3.2" />
    <circle class="sp-t2" cx="420" cy="170" r="3.2" />
    <circle class="sp-t1" cx="520" cy="290" r="3.2" />
    <circle class="sp-t3" cx="1120" cy="640" r="3.2" />
    <circle class="sp-t2" cx="1230" cy="590" r="3.2" />
    <circle class="sp-t3" cx="1340" cy="690" r="3.2" />
    <circle class="sp-t2" cx="1440" cy="610" r="3.2" />
    <circle class="sp-t1" cx="1500" cy="730" r="3.2" />
    <circle class="sp-t2" cx="1150" cy="140" r="3.2" />
    <circle class="sp-t3" cx="1260" cy="200" r="3.2" />
    <circle class="sp-t2" cx="1380" cy="130" r="3.2" />
  </g>

  <!-- STARS -->
  <g>
    <circle class="sp-t1" cx="90" cy="80" r="1.4" />
    <circle class="sp-t2" cx="210" cy="320" r="1.8" />
    <circle class="sp-t1" cx="140" cy="520" r="1.4" />
    <circle class="sp-t3" cx="60" cy="700" r="2.4" />
    <circle class="sp-t1" cx="330" cy="420" r="1.4" />
    <circle class="sp-t2" cx="260" cy="620" r="1.8" />
    <circle class="sp-t1" cx="400" cy="780" r="1.4" />
    <circle class="sp-t2" cx="560" cy="90" r="1.8" />
    <circle class="sp-t1" cx="610" cy="820" r="1.4" />
    <circle class="sp-t1" cx="700" cy="60" r="1.4" />
    <circle class="sp-t2" cx="900" cy="80" r="1.8" />
    <circle class="sp-t1" cx="1010" cy="810" r="1.4" />
    <circle class="sp-t1" cx="1100" cy="300" r="1.4" />
    <circle class="sp-t2" cx="1210" cy="420" r="1.8" />
    <circle class="sp-t1" cx="1500" cy="330" r="1.4" />
    <circle class="sp-t3" cx="1540" cy="520" r="2.4" />
    <circle class="sp-t1" cx="1420" cy="820" r="1.4" />
    <circle class="sp-t2" cx="1300" cy="780" r="1.8" />
    <circle class="sp-t2" cx="1560" cy="110" r="1.8" />
    <circle class="sp-t3" cx="980" cy="150" r="2.4" />
    <circle class="sp-t1" cx="560" cy="560" r="1.4" />
    <circle class="sp-t1" cx="1040" cy="560" r="1.4" />
    <circle class="sp-t1" cx="470" cy="350" r="1.4" />
    <circle class="sp-t1" cx="1180" cy="740" r="1.4" />
    <circle class="sp-t2" cx="780" cy="860" r="1.8" />
    <circle class="sp-t1" cx="30" cy="300" r="1.4" />
    <circle class="sp-t1" cx="1590" cy="640" r="1.4" />
    <circle class="sp-t1" cx="1000" cy="730" r="1.4" />
  </g>

  <!-- EMBLEM -->
  <circle class="sp-halo sp-rot" cx="800" cy="370" r="200" fill="url(#sp-halo)" />

  <circle class="sp-rot sp-orbit" cx="800" cy="370" r="150" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 9" style="stroke: var(--sp-star, #d2dcff)" opacity=".45" />

  <g class="sp-rot sp-sat">
    <circle cx="950" cy="370" r="9" style="fill: var(--sp-accent2, #c18bff)" opacity=".5" filter="url(#sp-blur)" />
    <circle cx="950" cy="370" r="5" style="fill: var(--sp-accent2, #c18bff)" />
  </g>

  <circle cx="800" cy="370" r="118" fill="none" stroke-width="1" style="stroke: var(--sp-line, rgba(150,165,255,.3))" />

  <g class="sp-rot sp-spin">
    <circle cx="800" cy="370" r="118" fill="none" stroke="url(#sp-acc)" stroke-width="8" stroke-linecap="round" stroke-dasharray="190 552" opacity=".65" filter="url(#sp-blur)" />
    <circle cx="800" cy="370" r="118" fill="none" stroke="url(#sp-acc)" stroke-width="4" stroke-linecap="round" stroke-dasharray="190 552" />
  </g>

  <circle cx="800" cy="370" r="84" fill="url(#sp-acc)" />
  <circle cx="800" cy="370" r="84" fill="url(#sp-shine)" />
  <circle cx="800" cy="370" r="83" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="1.5" />

  <text x="800" y="403" text-anchor="middle" font-family="'SN Pro', 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="92" font-weight="800" fill="#fff">R</text>

  <!-- BRAND -->
  <g class="sp-in">
    <text x="800" y="565" text-anchor="middle" font-family="'SN Pro', 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="800" letter-spacing="-1" style="fill: var(--sp-text, #eef0ff)">Route<tspan style="fill: var(--sp-accent, #8794ff)">Posts</tspan></text>
  </g>

  <g class="sp-in sp-in-2">
    <text x="800" y="606" text-anchor="middle" font-family="'SN Pro', 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" letter-spacing="1" style="fill: var(--sp-muted, #9aa3cc)">Loading your feed…</text>
  </g>

  <!-- PROGRESS -->
  <g class="sp-in sp-in-3">
    <rect x="690" y="642" width="220" height="4" rx="2" style="fill: var(--sp-line, rgba(150,165,255,.18))" />
    <g clip-path="url(#sp-clip)">
      <rect class="sp-bar" x="690" y="642" width="100" height="4" rx="2" fill="url(#sp-acc)" />
    </g>
  </g>
</svg>
