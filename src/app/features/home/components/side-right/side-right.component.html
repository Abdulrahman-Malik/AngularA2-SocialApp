
<aside
  class="sticky top-4 w-full min-w-0 overflow-hidden rounded-[24px] border border-slate-200/80 bg-white font-sans shadow-[0_8px_30px_rgba(15,23,42,0.04)]"
  aria-label="Suggested friends"
>
  <!-- Header -->
  <div class="flex items-center justify-between border-b border-slate-100 px-5 py-4">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-50 text-blue-600">
        <i class="fa-solid fa-user-group text-base"></i>
      </div>

      <div>
        <h2 class="text-sm font-extrabold tracking-tight text-slate-900">
          Suggested Friends
        </h2>
        <p class="mt-1 text-[11px] text-slate-500">
          People you may know
        </p>
      </div>
    </div>

    <span class="flex h-7 min-w-7 items-center justify-center rounded-lg bg-blue-50 px-2 text-xs font-bold text-blue-700">
      5
    </span>
  </div>

  <!-- Search -->
  <div class="px-4 pt-4">
    <label class="relative block">
      <i class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-slate-400"></i>

      <input
        type="search"
        class="w-full rounded-xl border border-slate-200 bg-slate-50/70 py-3 pl-9 pr-3 text-xs text-slate-800 outline-none transition placeholder:text-slate-400 focus:border-blue-300 focus:bg-white focus:ring-4 focus:ring-blue-50"
        placeholder="Search friends..."
        aria-label="Search friends"
      />
    </label>
  </div>

  <!-- Friends -->
  <div class="grid max-h-96 gap-2 overflow-y-auto px-3 py-3">
    <!-- Friend 1 -->
    <div class="group rounded-2xl border border-transparent p-3 transition-all duration-200 hover:border-slate-200 hover:bg-slate-50/80">
      <div class="flex items-center gap-3">
        <div class="relative shrink-0">
          <img
            src="https://i.pravatar.cc/150?img=11"
            alt="Ahmed Bahnasy"
            class="h-12 w-12 rounded-full border-2 border-white object-cover shadow-sm"
          />
          <span class="absolute bottom-0 right-0 h-3 w-3 rounded-full border-2 border-white bg-emerald-500"></span>
        </div>

        <div class="min-w-0 flex-1">
          <h3 class="truncate text-[13px] font-bold text-slate-900">
            Ahmed Bahnasy
          </h3>
          <p class="mt-1 truncate text-[11px] text-slate-500">
            @bahnasy20222
          </p>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            <span class="rounded-md bg-slate-100 px-2 py-1 text-[10px] font-semibold text-slate-500">
              41 followers
            </span>
            <span class="rounded-md bg-blue-50 px-2 py-1 text-[10px] font-semibold text-blue-600">
              2 mutual
            </span>
          </div>
        </div>

        <button
          type="button"
          class="flex shrink-0 items-center justify-center gap-1.5 rounded-xl bg-blue-600 px-3 py-2 text-[11px] font-bold text-white shadow-sm shadow-blue-600/15 transition hover:bg-blue-700 active:scale-95"
        >
          <i class="fa-solid fa-user-plus text-[10px]"></i>
          Follow
        </button>
      </div>
    </div>

    <!-- Friend 2 -->
    <div class="group rounded-2xl border border-transparent p-3 transition-all duration-200 hover:border-slate-200 hover:bg-slate-50/80">
      <div class="flex items-center gap-3">
        <img
          src="https://i.pravatar.cc/150?img=32"
          alt="Suggested friend"
          class="h-12 w-12 shrink-0 rounded-full border-2 border-white object-cover shadow-sm"
        />

        <div class="min-w-0 flex-1">
          <h3 class="truncate text-[13px] font-bold text-slate-900">
            Mohamed Ali
          </h3>
          <p class="mt-1 truncate text-[11px] text-slate-500">
            @mohamed.ali
          </p>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            <span class="rounded-md bg-slate-100 px-2 py-1 text-[10px] font-semibold text-slate-500">
              86 followers
            </span>
            <span class="rounded-md bg-blue-50 px-2 py-1 text-[10px] font-semibold text-blue-600">
              4 mutual
            </span>
          </div>
        </div>

        <button
          type="button"
          class="flex shrink-0 items-center justify-center gap-1.5 rounded-xl bg-blue-600 px-3 py-2 text-[11px] font-bold text-white shadow-sm shadow-blue-600/15 transition hover:bg-blue-700 active:scale-95"
        >
          <i class="fa-solid fa-user-plus text-[10px]"></i>
          Follow
        </button>
      </div>
    </div>

    <!-- Friend 3 -->
    <div class="group rounded-2xl border border-transparent p-3 transition-all duration-200 hover:border-slate-200 hover:bg-slate-50/80">
      <div class="flex items-center gap-3">
        <img
          src="https://i.pravatar.cc/150?img=47"
          alt="Suggested friend"
          class="h-12 w-12 shrink-0 rounded-full border-2 border-white object-cover shadow-sm"
        />

        <div class="min-w-0 flex-1">
          <h3 class="truncate text-[13px] font-bold text-slate-900">
            Sara Hassan
          </h3>
          <p class="mt-1 truncate text-[11px] text-slate-500">
            @sarahassan
          </p>
          <div class="mt-2 flex flex-wrap items-center gap-1.5">
            <span class="rounded-md bg-slate-100 px-2 py-1 text-[10px] font-semibold text-slate-500">
              63 followers
            </span>
            <span class="rounded-md bg-blue-50 px-2 py-1 text-[10px] font-semibold text-blue-600">
              3 mutual
            </span>
          </div>
        </div>

        <button
          type="button"
          class="flex shrink-0 items-center justify-center gap-1.5 rounded-xl bg-blue-600 px-3 py-2 text-[11px] font-bold text-white shadow-sm shadow-blue-600/15 transition hover:bg-blue-700 active:scale-95"
        >
          <i class="fa-solid fa-user-plus text-[10px]"></i>
          Follow
        </button>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div class="border-t border-slate-100 p-3">
    <button
      type="button"
      class="flex w-full items-center justify-center gap-2 rounded-xl py-3 text-xs font-bold text-blue-600 transition hover:bg-blue-50"
    >
      View all suggestions
      <i class="fa-solid fa-arrow-right text-[10px]"></i>
    </button>
  </div>
</aside>
